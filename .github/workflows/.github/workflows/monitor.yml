name: Anomaly monitor

on:
  workflow_dispatch:
    inputs:
      source:
        description: "File path in the repo or URL of a CSV/JSON to analyse"
        default: "sample_data/synthetic_transactions.csv"
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      FEED_URL: ${{ secrets.FEED_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Decide what to analyse
        id: src
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$FEED_URL" ]; then echo "skip=true" >> $GITHUB_OUTPUT; exit 0; fi
            echo "source=$FEED_URL" >> $GITHUB_OUTPUT
            echo "recent=2" >> $GITHUB_OUTPUT
          else
            echo "source=${{ github.event.inputs.source }}" >> $GITHUB_OUTPUT
            echo "recent=0" >> $GITHUB_OUTPUT
          fi

      - name: Run the detector
        if: steps.src.outputs.skip != 'true'
        run: |
          python monitor.py --source "${{ steps.src.outputs.source }}" --recent-hours ${{ steps.src.outputs.recent }}
          cat reports/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Save the report
        if: steps.src.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: anomaly-report
          path: reports/

      - name: Open an issue for new Critical/High incidents
        if: steps.src.outputs.skip != 'true' && github.event_name == 'schedule' && hashFiles('reports/new_alerts.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Payment anomaly detected $(date -u '+%Y-%m-%d %H:00 UTC')" --body-file reports/new_alerts.md
